# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# To use your own Apple developer account, change BUNDLE_PREFIX / FL_APP_GROUP below
# (and AppGroup.defaultIdentifier in Shared/AppGroup.swift), then set DEVELOPMENT_TEAM.
name: FloatLingo
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    BUNDLE_PREFIX: com.sosoalqawe12.floatlingo
    FL_APP_GROUP: group.com.sosoalqawe12.floatlingo
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  FloatLingo:
    type: application
    platform: iOS
    sources:
      - path: FloatLingo
      - path: Shared
    dependencies:
      - target: FloatLingoBroadcast
        embed: true
    settings:
      base:
        PRODUCT_NAME: FloatLingo
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false

  FloatLingoBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: FloatLingoBroadcast
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: FloatLingoBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).broadcast
        INFOPLIST_FILE: Config/Broadcast-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Broadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
